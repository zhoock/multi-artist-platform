[build]
  publish = "dist"
  functions = "netlify/functions"
  # dist/_redirects только для production/deploy-preview: правила в netlify.toml глобальны
  # и в Netlify Dev применяются до проксирования на webpack (ломает /scripts/main.js).
  # Полная таблица /api/* генерируется из netlify.toml (см. scripts/generate-dist-redirects.ts).
  command = "npm run build && tsx scripts/generate-dist-redirects.ts"

[dev]
  command = "npm start"
  targetPort = 8080
  port = 8888

[context.dev.environment]
  PUBLIC_APP_URL = "http://localhost:8080"
  DEV_PAYMENT_MODE = "true"

# ---------- Статические файлы ----------
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# ---------- API: СНАЧАЛА САМЫЕ СПЕЦИФИЧНЫЕ ----------

# Covers (draft/commit) — должны быть ДО /api/albums* и ДО /api/*
[[redirects]]
  from = "/api/albums/cover/draft*"
  to = "/.netlify/functions/upload-cover-draft"
  status = 200
  force = true

[[redirects]]
