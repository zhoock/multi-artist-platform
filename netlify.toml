[build]
  publish = "dist"
  functions = "netlify/functions"
  # SPA fallback пишем в dist/_redirects при деплое: redirects в netlify.toml глобальны
  # и применяются в Netlify Dev до проксирования на webpack (ломает /scripts/main.js).
  command = "npm run build && printf '%s\\n' '/*    /index.html   200' > dist/_redirects"

[dev]
  command = "npm start"
  targetPort = 8080
  port = 8888

[context.dev.environment]
  PUBLIC_APP_URL = "http://localhost:8080"

# ---------- Статические файлы ----------
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = true

