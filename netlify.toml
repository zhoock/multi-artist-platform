# ---------- SPA ----------
# Redirects в netlify.toml глобальны (включая Netlify Dev) — см. docs Netlify.
# Production/deploy-preview: scripts/generate-dist-redirects.ts → dist/_redirects в [build].command.
# Netlify Dev проксирует /scripts/main.js на webpack (8080); historyApiFallback — там.

[functions."scheduled-subscription-renewals"]
  schedule = "*/15 * * * *"
