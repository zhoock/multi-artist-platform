# PR-10 P0 merge gate — real PostgreSQL, migrations 066–070, no shared Supabase.
# @see docs/adr/pr-10-e2e-specification.md §3.1
name: PR-10 P0 E2E (merge gate)

on:
  pull_request:
    paths:
      - '.github/workflows/pr10-e2e-quick.yml'
      - 'database/migrations/**'
      - 'jest.config.pr10.ts'
      - 'netlify/functions/**'
      - 'scripts/ci/**'
      - 'scripts/migrate-database.ts'
      - 'src/features/premiumSubscription/**'
      - 'src/pages/UserDashboard/components/archive/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/pr10-e2e-quick.yml'
      - 'database/migrations/**'
      - 'jest.config.pr10.ts'
      - 'netlify/functions/**'
      - 'scripts/ci/**'
      - 'scripts/migrate-database.ts'
      - 'src/features/premiumSubscription/**'
      - 'src/pages/UserDashboard/components/archive/**'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: pr10-p0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr10-p0:
    name: P0 subscription E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pr10
          POSTGRES_PASSWORD: pr10
          POSTGRES_DB: pr10_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pr10 -d pr10_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Ephemeral CI database — not Supabase; full schema from npm run migrate.
      DATABASE_URL: postgresql://pr10:pr10@localhost:5432/pr10_e2e
      DATABASE_URL_TEST: postgresql://pr10:pr10@localhost:5432/pr10_e2e
      DEV_PAYMENT_MODE: 'true'
      SUBSCRIPTION_AUTO_RENEW_ENABLED: 'true'
      NODE_ENV: test
      YOOKASSA_TEST_MODE: 'true'
      JWT_SECRET: ci-pr10-jwt-secret-with-sufficient-length-32chars
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations (clean database)
        run: npm run migrate

      - name: Verify subscription migrations 066–070
        run: npx tsx scripts/ci/verify-subscription-migrations.ts

      - name: Run P0 E2E suite (merge gate)
        run: npm run test:e2e:quick
